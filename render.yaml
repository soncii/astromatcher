services:
  - type: web
    name: astro-matcher
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANALYTICS_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: COUNTRY_LOOKUP
        value: "on"
      - key: TRUST_PROXY_GEO
        value: "1"
